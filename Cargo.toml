[workspace]
resolver = "2"
members = [
    "crates/fox-core",
    "crates/fox-storage",
    "crates/fox-http",
    "crates/fox-grpc",
    "crates/fox-openapi",
    "crates/fox-mock",
    "crates/fox-test",
    "crates/fox-backup",
    "crates/fox-secret",
    "crates/fox-codegen",
    "crates/fox-oauth",
    "crates/fox-smoke",
    "crates/fox-agent",
    "crates/fox-mcp",
    "crates/fox-sign",
    "crates/fox-sync",
    "crates/fox-skill",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/weihubeats/RustFox"
homepage = "https://weihubeats.github.io/RustFox/"
description = "RustFox — lightweight cross-platform API debugging client (backend crates)"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 已停止维护，serde_norway 是其 API 兼容的社区接续分支
serde_norway = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 按实际用量裁剪特性（rt/macros/net/time/io-util/fs/sync），避免 full 拖慢编译
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "fs",
    "sync",
] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
futures = "0.3"
async-trait = "0.1"
regex = "1"
url = "2"
bytes = "1"
indexmap = { version = "2", features = ["serde"] }
dirs = "7"
aes-gcm = "0.11"
base64 = "0.23"
# 签名类认证（Digest / Hawk / AWS SigV4 / HMAC AK-SK）：fox-sign 专用
hmac = "0.13"
sha2 = "0.11"
md5 = "0.8"
hex = "0.4"
# 动态签名（App-Key/Secret/Timestamp/Sig）：fox-http signature.rs 用（md-5 与 sha2/hmac 同步 digest 0.11）
md-5 = "0.11"

sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "cookies",
    "multipart",
    "rustls-tls",
] }

webbrowser = "1"

axum = "0.8"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

openapiv3 = "2.0"
jsonpath-rust = "1.0"
fake = "2.9"
rand = "0.10"

serde_urlencoded = "0.7"
rquickjs = "0.14"
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "url",
    "rustls-tls-webpki-roots",
] }
shell-words = "1.1"

# gRPC 客户端（tonic 动态调用）：prost-reflect 免生成代码，protox 纯 Rust 运行时编译 .proto
# tonic 0.14 起 prost 集成拆分至 tonic-prost，核心只保留 codec/transport 能力
tonic = { version = "0.14", default-features = false, features = [
    "transport",
    "codegen",
    "channel",
    "tls-ring",
    "tls-native-roots",
] }
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
tonic-reflection = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "s"