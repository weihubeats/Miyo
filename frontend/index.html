<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miyo</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // 首帧主题预置（防 FOUC）：style.css 的 :root 是深色基线，而主题应用在
      // 延迟执行的 module 脚本里——不在此同步写属性，浅色/跟随系统浅色的用户
      // 每次启动都会先渲染一帧默认深色再翻转（跟随系统 bug 的实证根因）。
      // 此处镜像 stores/theme.ts 的解析逻辑（含旧版三态键迁移）：
      // version 校验失败/存储不可用/JSON 损坏 → 保持深色基线（与 store 回退一致）。
      (function () {
        try {
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          var LIGHT = { light: 1, 'ocean-light': 1, forest: 1, sand: 1, lavender: 1 };
          var BUILTIN = ['light', 'dark', 'ocean', 'ocean-light', 'forest-dark', 'forest', 'sand', 'lavender'];
          var id = dark ? 'dark' : 'light';
          var custom = null;
          var raw = localStorage.getItem('miyo.theme.config');
          var c = raw ? JSON.parse(raw) : null;
          if (c && c.version === 1) {
            // 记忆对无效时与 store 的 pickId 回退一致：深侧回 dark、浅侧回 light
            var pickPair = function (v, fb) { return BUILTIN.indexOf(v) !== -1 || v === 'custom' ? v : fb; };
            var sys = c.mode === 'system'
              ? (dark ? pickPair(c.lastDark, 'dark') : pickPair(c.lastLight, 'light'))
              : (BUILTIN.indexOf(c.current) !== -1 || c.current === 'custom' ? c.current : 'dark');
            if (sys === 'custom' && c.custom && typeof c.custom === 'object') {
              id = 'custom';
              custom = c.custom;
            } else if (BUILTIN.indexOf(sys) !== -1) {
              id = sys;
            } else {
              id = 'dark';
            }
          } else {
            // 旧版三态键（system|dark|light）：main.ts 的迁移读它，这里首帧同样尊重它
            var legacy = localStorage.getItem('miyo.theme.mode');
            if (legacy === 'light') id = 'light';
            else if (legacy === 'system') id = dark ? 'dark' : 'light';
            else if (legacy === 'dark') id = 'dark';
          }
          var base =
            id === 'custom' && custom
              ? custom.base === 'light' ? 'light' : 'dark'
              : LIGHT[id] ? 'light' : 'dark';
          root.setAttribute('data-theme', base);
          root.setAttribute('data-theme-id', id);
          root.setAttribute('data-style', c && (c.style === 'minimal' || c.style === 'soft') ? c.style : 'studio');
          root.classList.toggle('dark', base === 'dark');
          root.classList.toggle('light', base === 'light');
        } catch (e) {
          // 存储不可用（隐私模式等）/JSON 损坏：保持 :root 深色基线，与 store 回退一致
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 兼容较老 WebView2 / WebKit 内核 + 启动前故障兜底（规避白屏/黑屏无反馈）：
      // 1) 为依赖（如 CodeMirror）补齐 Object.hasOwn / Array.prototype.at；
      // 2) 在 ES module 求值与 Vue 挂载前捕获 error / unhandledrejection 与启动超时，
      //    挂载成功后由 main.ts 调用 __MIYO_BOOT__.done() 交棒给 App.vue。
      (function () {
        if (typeof Object.hasOwn !== 'function') {
          Object.hasOwn = function (obj, prop) {
            return Object.prototype.hasOwnProperty.call(Object(obj), prop);
          };
        }
        if (typeof Array.prototype.at !== 'function') {
          Array.prototype.at = function (idx) {
            var len = this.length >>> 0;
            var k = idx >= 0 ? idx : len + idx;
            return k >= 0 && k < len ? this[k] : undefined;
          };
        }

        var errors = [];
        var rendered = false;
        var timer = null;

        function formatErr(err) {
          if (!err) return 'Unknown error';
          if (typeof err === 'string') return err;
          if (err.stack) return String(err.stack);
          if (err.message) return String(err.message);
          try {
            return JSON.stringify(err);
          } catch (e) {
            return String(err);
          }
        }

        /**
         * 渲染启动异常兜底页。也由「运行时能力探测」在核心 JS 语法不受支持时调用：
         * 那种情况下 main.ts / style.css 根本跑不起来，页面只剩窗口底色 = 用户说的
         * 黑屏（issue #192：Win Server 2016 + 旧 WebView2）。
         *
         * 注意两点踩坑：
         * 1) 只用 inline style，不依赖任何外部样式表（style.css 此时可能未加载）；
         * 2) 不用 flex 居中（Chromium 90 之前带前缀），改用 margin:auto + 固定宽度。
         */
        function renderFallback(timeoutReason, detail) {
          if (boot.mounted || rendered) return;
          var app = document.getElementById('app');
          if (!app) return;
          if (app.childNodes && app.childNodes.length > 0 && !timeoutReason && !detail) return;
          rendered = true;

          var diag = collectDiagnostics(detail);

          // 同步落到 console：即使本页没画出来（背景色被强制 / 字体渲染异常），
          // WebView2 用户数据目录里的日志文件与 Console 里也能看到原因。
          try {
            console.error('[miyo.boot-fallback]', timeoutReason || detail || 'error', diag);
          } catch (e) {
            /* console 不可用时忽略 */
          }

          var isLight = document.documentElement.getAttribute('data-theme') === 'light';
          var isZh = (navigator.language || '').toLowerCase().indexOf('zh') === 0;
          var bg = isLight ? '#f5f6f8' : '#141418';
          var cardBg = isLight ? '#ffffff' : '#1b1b22';
          var border = isLight ? '#d4d6de' : '#2e303d';
          var text = isLight ? '#18181b' : '#eceef4';
          var muted = isLight ? '#52525b' : '#9ca3af';
          var codeBg = isLight ? '#f4f4f5' : '#0f0f13';

          app.innerHTML = '';
          var wrap = document.createElement('div');
          wrap.setAttribute(
            'style',
            'position:fixed;top:0;left:0;right:0;bottom:0;overflow:auto;padding:24px;box-sizing:border-box;background:' +
              bg +
              ';color:' +
              text +
              ';font-family:Segoe UI,Microsoft YaHei,PingFang SC,sans-serif;'
          );

          var card = document.createElement('div');
          card.setAttribute(
            'style',
            'width:640px;max-width:100%;margin:auto;padding:20px 24px;border-radius:10px;background:' +
              cardBg +
              ';border:1px solid ' +
              border +
              ';box-sizing:border-box;'
          );

          var title = document.createElement('h2');
          title.setAttribute('style', 'margin:0 0 8px 0;font-size:16px;font-weight:600;');
          title.textContent = isZh ? 'Miyo 启动异常' : 'Miyo failed to start';

          var desc = document.createElement('p');
          desc.setAttribute('style', 'margin:0 0 12px 0;font-size:13px;line-height:1.6;color:' + muted + ';');
          desc.textContent = isZh
            ? '前端未能正常初始化。最常见原因是系统里的 WebView2 运行时过旧（Windows Server 2016 / Windows 8.1 / 早期 Win10 自带的是 IE 内核）。' +
              '修复方法：安装「Microsoft Edge WebView2 Runtime」常青版后重启 Miyo。下方诊断信息可直接反馈给开发者。'
            : 'The frontend failed to initialize. The usual cause is an outdated WebView2 runtime (Windows Server 2016, Windows 8.1 and early Windows 10 ship the old IE engine). ' +
              'Fix: install the evergreen Microsoft Edge WebView2 Runtime, then restart Miyo. The diagnostics below can be shared with the developer.';

          var pre = document.createElement('pre');
          pre.setAttribute(
            'style',
            'margin:0 0 14px 0;padding:12px;border-radius:6px;background:' +
              codeBg +
              ';border:1px solid ' +
              border +
              ';font-family:Consolas,monospace;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-all;max-height:320px;overflow:auto;'
          );
          var detailLines = ['Reason: ' + (timeoutReason || detail || 'error')];
          for (var i = 0; i < diag.length; i++) detailLines.push(diag[i]);
          for (var j = 0; j < errors.length; j++) detailLines.push('[Error ' + (j + 1) + '] ' + errors[j]);
          pre.textContent = detailLines.join('\n');

          var actions = document.createElement('div');
          actions.setAttribute('style', 'display:flex;gap:8px;flex-wrap:wrap;');
          function addButton(label, primary, onClick) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = label;
            btn.setAttribute(
              'style',
              'padding:6px 14px;border-radius:6px;border:1px solid ' +
                border +
                ';background:' +
                (primary ? '#6366f1' : 'transparent') +
                ';color:' +
                (primary ? '#ffffff' : text) +
                ';font-size:13px;cursor:pointer;'
            );
            btn.onclick = onClick;
            actions.appendChild(btn);
            return btn;
          }

          addButton(isZh ? '重新加载' : 'Reload', true, function () {
            location.reload();
          });
          // 探测环境常把完整的 WebView2 版本放在 navigator.userAgent 里；
          // 单独一行便于用户复制。无效点击时无副作用。
          addButton(isZh ? '复制诊断信息' : 'Copy diagnostics', false, function () {
            var dump = detailLines.join('\n');
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(dump);
                return;
              }
            } catch (e) {
              /* 退回选中文本 */
            }
            var sel = window.getSelection && window.getSelection();
            if (sel) {
              var range = document.createRange();
              range.selectNodeContents(pre);
              sel.removeAllRanges();
              sel.addRange(range);
            }
          });

          card.appendChild(title);
          card.appendChild(desc);
          card.appendChild(pre);
          card.appendChild(actions);
          wrap.appendChild(card);
          app.appendChild(wrap);
        }

        /** 诊断行：UA / URL / 内核版本；WebView2 不可用（IE 内核）时也能正常工作。 */
        function collectDiagnostics(detail) {
          var lines = [];
          try {
            lines.push('UA: ' + navigator.userAgent);
            lines.push('Platform: ' + (navigator.platform || '-') + ' / ' + (navigator.language || '-'));
            lines.push('URL: ' + location.href);
            lines.push('Title: ' + document.title + ' | Referrer: ' + (document.referrer || '-'));
            // 关键能力探测：WebView2（Chromium）有 Promise；IE 内核没有。
            // 内联脚本按 ES5 写，IE 里也能跑到这里并把结论写出来。
            lines.push('Features: Promise=' + (typeof Promise) + ' Symbol=' + (typeof Symbol) +
              ' fetch=' + (typeof fetch) + ' class=' + (function () { try { eval('class X{}'); return 'yes'; } catch (e) { return 'no'; } })() +
              ' module=' + (!!(window.HTMLScriptElement && 'noModule' in document.createElement('script'))));
          } catch (e) {
            lines.push('Diagnostics failed: ' + formatErr(e));
          }
          if (detail) lines.push('Detail: ' + detail);
          return lines;
        }

        function onPreMountError(e) {
          var msg = e && (e.error || e.message) ? formatErr(e.error || e.message) : 'Script error';
          if (e && e.filename) msg += ' (' + e.filename + ':' + e.lineno + ':' + e.colno + ')';
          errors.push(msg);
          renderFallback(null, 'uncaught error');
        }

        function onPreMountRejection(e) {
          errors.push('UnhandledRejection: ' + formatErr(e && e.reason));
          renderFallback(null, 'unhandled rejection');
        }

        var boot = {
          mounted: false,
          fail: function (err) {
            errors.push(formatErr(err));
            renderFallback(null, 'bootstrap failed');
          },
          done: function () {
            boot.mounted = true;
            if (timer) {
              clearTimeout(timer);
              timer = null;
            }
            window.removeEventListener('error', onPreMountError);
            window.removeEventListener('unhandledrejection', onPreMountRejection);
          }
        };

        window.__MIYO_BOOT__ = boot;
        window.addEventListener('error', onPreMountError);
        window.addEventListener('unhandledrejection', onPreMountRejection);
        timer = setTimeout(function () {
          if (!boot.mounted) {
            renderFallback('Bootstrap did not complete within 10s');
          }
        }, 10000);

        // 运行时能力探测（issue #192）：打包产物与 style.css 都按 es2020 / chrome87
        // 编译（用了可选链、class 等语法）。系统里只有 IE 内核（WebView2 运行时未安装 /
        // 被服务器策略禁用）时，module 脚本与 `<script nomodule>` 双双不执行，
        // 页面永远停在窗口底色 = 黑屏、无任何提示。ES5 写的这段探测能跑到，
        // 于是把「真实原因」直接渲染出来，用户不必打开开发者工具。
        try {
          var supportsCoreJs = typeof Promise === 'function' && typeof Symbol === 'function';
          if (!supportsCoreJs) {
            renderFallback(
              'WebView2 runtime missing or unavailable (IE engine detected)',
              'Promise/Symbol 不存在：当前内核为旧版 IE，请安装 Microsoft Edge WebView2 Runtime'
            );
          }
        } catch (probeError) {
          renderFallback('Runtime probe failed', String(probeError));
        }
      })();
    </script>
    <script nomodule>
      if (window.__MIYO_BOOT__) {
        window.__MIYO_BOOT__.fail('ES modules are not supported by this WebView runtime.');
      }
    </script>
    <script>
      // 浏览器截图/验收辅助（dev-only）：?miyo-e2e=1 时加载 public 下的 IPC
      // 数据桩（固定 fixture），让界面脱离 Tauri 后端也能渲染。生产构建不会
      // 带查询参数，本分支永不激活；桩文件也从未被应用代码引用。
      if (new URLSearchParams(location.search).has('miyo-e2e')) {
        document.write('<script src="/dev-screenshot-stub.js"><\/script>');
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
