[package]
name = "miyo"
version = "0.0.67"
edition = "2021"
description = "Miyo Tauri 2 应用壳：装配 miyo-tauri 插件与窗口生命周期"
license = "Apache-2.0"
repository = "https://github.com/weihubeats/Miyo"
homepage = "https://weihubeats.github.io/Miyo/"

# 独立工作区：不加入仓库根 workspace，避免 tauri/wry 依赖拖慢主仓构建。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools 仅 debug 构建（release 门禁见下方 target 表）：生产窗口不再可唤起
# DevTools 调用全部 IPC（缩小误操作 / 数据导出面）；tauri.conf.json 的
# devtools 同步为 false。
tauri = { version = "2", features = [] }
tracing = "0.1"
# 黑屏诊断报告的时间戳（issue #192）
chrono = "0.4"

[target.'cfg(debug_assertions)'.dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miyo-tauri = { path = "../../crates/miyo-tauri" }
# 黑屏兜底（issue #192）需要：日志目录 + 原生错误框（Windows 下没有控制台）
miyo-storage = { path = "../../crates/miyo-storage" }
rfd = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows-version = "0.1"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
] }
# 渲染进程存活监控（issue #192）：ProcessFailed 回调注册在 ICoreWebView2_2 上。
# 版本与 wry 传递依赖的保持一致，避免同 crate 两份实例导致接口 cast 失败。
webview2-com = "0.39"
windows-core = "0.62"

# 最终产物尺寸优先：LTO + 符号剥离（与仓库根 workspace 的 release 配置保持一致）
# dev 构建瘦身：行号表级调试信息（backtrace 仍带行号；lldb 变量检查降级）。
# 依赖与测试二进制体积约降 60%——target/ 的最大增长源（deps 15G 实测）。
# 需要完整变量调试时临时改回 debug = true 并重编。
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "s"
