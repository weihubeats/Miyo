[package]
name = "miyo"
version = "0.0.58"
edition = "2021"
description = "Miyo Tauri 2 应用壳：装配 miyo-tauri 插件与窗口生命周期"
license = "Apache-2.0"
repository = "https://github.com/weihubeats/Miyo"
homepage = "https://weihubeats.github.io/Miyo/"

# 独立工作区：不加入仓库根 workspace，避免 tauri/wry 依赖拖慢主仓构建。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools 仅 debug 构建（release 门禁见下方 target 表）：生产窗口不再可唤起
# DevTools 调用全部 IPC（缩小误操作 / 数据导出面）；tauri.conf.json 的
# devtools 同步为 false。
tauri = { version = "2", features = [] }

[target.'cfg(debug_assertions)'.dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miyo-tauri = { path = "../../crates/miyo-tauri" }

# 最终产物尺寸优先：LTO + 符号剥离（与仓库根 workspace 的 release 配置保持一致）
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "s"
