[package]
name = "miyo-tauri"
version = "0.0.2"
edition = "2021"
description = "miyo-core / miyo-storage 的 Tauri 2 插件封装：Vue 3 前端通过 IPC 调用的 Command 层"
license = "Apache-2.0"
repository = "https://github.com/weihubeats/Miyo"
homepage = "https://weihubeats.github.io/Miyo/"
# links 决定权限命名空间前缀（与 lib.rs 中 Builder::new("miyo") 一致），
# 否则生成 miyo-tauri:allow-* 与运行时 plugin:miyo|* 不匹配导致「not allowed」。
links = "miyo"

# 独立工作区：不加入根 workspace，避免 tauri 依赖拖慢主仓构建。
# 依赖的 miyo-* crate 通过路径引用，其 workspace 继承仍解析到仓库根。
[workspace]

[dependencies]
miyo-core = { path = "../miyo-core" }
miyo-ai = { path = "../miyo-ai" }
miyo-storage = { path = "../miyo-storage" }
miyo-http = { path = "../miyo-http" }
miyo-oauth = { path = "../miyo-oauth" }
miyo-codegen = { path = "../miyo-codegen" }
miyo-mock = { path = "../miyo-mock" }
miyo-agent = { path = "../miyo-agent" }
miyo-backup = { path = "../miyo-backup" }
miyo-sync = { path = "../miyo-sync" }
miyo-grpc = { path = "../miyo-grpc" }
# Java 调试能力（feature「java」，默认开）：核心裁剪构建用
# --no-default-features（或 default = []）剔除 Attach 编排与 30 条命令。
miyo-java = { path = "../miyo-java", optional = true }
miyo-java-attach = { path = "../miyo-java-attach", optional = true }
miyo-sidecar = { path = "../miyo-sidecar" }
miyo-tasks = { path = "../miyo-tasks" }
miyo-openapi = { path = "../miyo-openapi" }
# Java 组件下载哈希校验（sha256 sidecar）
sha2 = "0.11"
hex = "0.4"
miyo-test = { path = "../miyo-test" }
miyo-plugin = { path = "../miyo-plugin" }

tauri = "2"
# 仅用于启动失败的阻塞式原生错误弹窗（无窗口阶段也能显示）
rfd = "0.18"
arboard = "3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 已停更，serde_norway 为 API 兼容接续分支（与根 workspace 一致）
serde_norway = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
# AI 聊天循环的 ToolExecutor / LoopObserver trait 实现（miyo-ai 用 async_trait）
async-trait = "0.1"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-util = "0.7"
# WS/SSE 实时调试命令：reqwest 长连接拉流 + futures 流消费 + base64 帧编码
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
] }
futures = "0.3"
base64 = "0.23"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }
# `ts` feature：CommandError / 关键 view DTO derive TS，导出 frontend/src/types/generated/
ts-rs = { version = "12", optional = true, default-features = false, features = [
    "serde-compat",
    "uuid-impl",
    "chrono-impl",
    "serde-json-impl",
] }

[features]
default = ["java"]
# Java Debug 全能力（v1 Runtime 客户端 + v2 Attach 编排 + 30 条 IPC 命令 +
# 组件自动下载）。关闭后 java_* 命令仍注册但一律返回 FEATURE_UNAVAILABLE
# （stub 见 commands/java_gate.rs）——前端诊断 UI 可读，列表不报未知命令。
java = ["dep:miyo-java", "dep:miyo-java-attach"]
ts = ["dep:ts-rs", "miyo-core/ts", "miyo-http/ts", "miyo-plugin/ts"]

[dev-dependencies]
tempfile = "3"
# 更新/回滚 E2E：内存构造 .miyo 包（tar.gz + sha256）
tar = { version = "0.4", default-features = false }
flate2 = "1"
sha2 = "0.11"
hex = "0.4"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

# Windows 专有：启动时读注册表探测 WebView2 运行时（issue #192 黑屏兜底）。
# 只有 Windows 目标才会编译 lib.rs 里的 win_reg_value；其它平台不拉这个依赖。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Registry"] }

# dev 构建瘦身：行号表级调试信息（backtrace 仍带行号；lldb 变量检查降级）。
# 依赖与测试二进制体积约降 60%——target/ 的最大增长源（deps 15G 实测）。
# 需要完整变量调试时临时改回 debug = true 并重编。
[profile.dev]
debug = "line-tables-only"

