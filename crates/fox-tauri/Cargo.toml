[package]
name = "fox-tauri"
version = "0.0.2"
edition = "2021"
description = "fox-core / fox-storage 的 Tauri 2 插件封装：Vue 3 前端通过 IPC 调用的 Command 层"
license = "Apache-2.0"
repository = "https://github.com/weihubeats/RustFox"
homepage = "https://weihubeats.github.io/RustFox/"
# links 决定权限命名空间前缀（与 lib.rs 中 Builder::new("fox") 一致），
# 否则生成 fox-tauri:allow-* 与运行时 plugin:fox|* 不匹配导致「not allowed」。
links = "fox"

# 独立工作区：不加入根 workspace，避免 tauri 依赖拖慢主仓构建。
# 依赖的 fox-* crate 通过路径引用，其 workspace 继承仍解析到仓库根。
[workspace]

[dependencies]
fox-core = { path = "../fox-core" }
fox-storage = { path = "../fox-storage" }
fox-http = { path = "../fox-http" }
fox-oauth = { path = "../fox-oauth" }
fox-codegen = { path = "../fox-codegen" }
fox-mock = { path = "../fox-mock" }
fox-agent = { path = "../fox-agent" }
fox-backup = { path = "../fox-backup" }
fox-sync = { path = "../fox-sync" }
fox-grpc = { path = "../fox-grpc" }
fox-openapi = { path = "../fox-openapi" }
fox-test = { path = "../fox-test" }
fox-skill = { path = "../fox-skill" }

tauri = "2"
# 仅用于启动失败的阻塞式原生错误弹窗（无窗口阶段也能显示）
rfd = "0.17"
arboard = "3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 已停更，serde_norway 为 API 兼容接续分支（与根 workspace 一致）
serde_norway = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-util = "0.7"
# WS/SSE 实时调试命令：reqwest 长连接拉流 + futures 流消费 + base64 帧编码
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
] }
futures = "0.3"
base64 = "0.23"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
