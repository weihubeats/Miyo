[package]
name = "miyo-agent"
version = "0.0.1"
edition = "2021"
description = "Agent 控制面：本地 HTTP API，供 AI Agent / MCP 工具把 cURL 导入为 Miyo 接口"
license = "Apache-2.0"
repository = "https://github.com/weihubeats/Miyo"
homepage = "https://weihubeats.github.io/Miyo/"

[dependencies]
miyo-core = { path = "../miyo-core" }
miyo-sign = { path = "../miyo-sign" }
miyo-storage = { path = "../miyo-storage" }
miyo-test = { path = "../miyo-test" }
miyo-sync = { path = "../miyo-sync" }
jsonpath-rust = "1.0"
miyo-http = { path = "../miyo-http" }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
# 控制面客户端（miyo-mcp 复用）与集成测试共用
reqwest = { workspace = true }
# 场景运行的取消令牌 / 总超时 watchdog（CancellationToken::cancel_after）
tokio-util = { workspace = true }
# 异步运行任务 panic 兜底（catch_unwind：任务崩溃时状态置 failed 而非卡 running）
futures = { workspace = true }

[dev-dependencies]
