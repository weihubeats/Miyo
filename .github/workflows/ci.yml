name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # TS 绑定防漂移：重新导出 miyo-core 模型绑定，与提交产物比对
      - name: Export TS bindings (miyo-core)
        run: cargo test -p miyo-core --features ts export_bindings
      - name: Check TS bindings drift (miyo-core)
        run: git diff --exit-code -- frontend/src/types/generated

  miyo-tauri:
    name: Check & Test (miyo-tauri 插件)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miyo-tauri
      - name: 规避 Azure Ubuntu 镜像不可达（CI 偶发 apt-get update 卡死）
        run: |
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
      - name: Install Linux dependencies (WebKit/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - name: Check
        working-directory: crates/miyo-tauri
        run: cargo check
      - name: Clippy（与主 workspace 同标准 -D warnings）
        working-directory: crates/miyo-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: crates/miyo-tauri
        run: cargo test
      # TS 绑定防漂移：导出 miyo-tauri view DTO 绑定（依赖 miyo-core/ts），与提交产物比对
      - name: Export TS bindings (miyo-tauri)
        working-directory: crates/miyo-tauri
        run: cargo test --features ts export_bindings
      - name: Check TS bindings drift (miyo-tauri)
        run: git diff --exit-code -- frontend/src/types/generated

  frontend:
    name: Build (Vue 前端 + Tauri 壳)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: 规避 Azure Ubuntu 镜像不可达（CI 偶发 apt-get update 卡死）
        run: |
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
      - name: Install Linux dependencies (WebKit/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - name: npm ci
        working-directory: frontend
        run: npm ci
      # tauri-build 在编译期校验 bundle.externalBin 文件存在，须先预置侧载二进制
      - name: Ensure miyo-mcp sidecar (bundle.externalBin)
        run: bash scripts/ensure-mcp-bin.sh
      # 复刻 tauri-cli 的版本一致性校验（npm 与 Rust 插件 major.minor 必须一致），
      # 否则 CI 的 cargo check 全绿、但 tauri build 打包时直接 exit 1（v0.0.32 踩过）。
      - name: Check Tauri npm/Rust 插件版本一致
        run: node scripts/check-tauri-plugin-versions.mjs
      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint
      - name: Test (vitest)
        working-directory: frontend
        run: npm test
      # 类型检查独立门禁（build 已瘦身为纯 vite build，类型错误在这里拦截）
      - name: Typecheck (vue-tsc)
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend (vite)
        working-directory: frontend
        run: npm run build
      - name: Check Tauri shell
        working-directory: frontend/src-tauri
        run: cargo check
      - name: Check Tauri shell (release profile, 覆盖 tauri build 打包路径)
        working-directory: frontend/src-tauri
        run: cargo check --release
