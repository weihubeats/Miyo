name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # TS 绑定防漂移：重新导出 miyo-core 模型绑定，与提交产物比对
      - name: Export TS bindings (miyo-core)
        run: cargo test -p miyo-core --features ts export_bindings
      - name: Check TS bindings drift (miyo-core)
        run: git diff --exit-code -- frontend/src/types/generated

  # 桌面壳（frontend/src-tauri）是独立 workspace，且 Windows 专属代码在
  # macOS/Linux 上整片跳过编译（`#[cfg(target_os = "windows")]`）。v0.0.65/v0.0.67
  # 两次都是发版时才在 Package (windows) 里炸出编译错误——这里提前挡一道。
  desktop-shell-windows:
    name: Desktop shell compile (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: shell-windows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # tauri-build 依赖前端产物与资源清单，先装依赖并构建 dist
      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Clippy (desktop shell, windows cfg)
        working-directory: frontend/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  # 插件平台 crate 三平台测试（miyo-plugin / miyo-sidecar / miyo-storage）：
  # Sidecar 进程管理与签名校验是平台相关代码，单平台测试易漏检
  plugin-crates:
    name: Plugin crates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: plugin-${{ matrix.os }}
      - name: Test miyo-plugin / miyo-sidecar / miyo-storage
        run: cargo test -p miyo-plugin -p miyo-sidecar -p miyo-storage

  # Java Attach 2.0：agent/launcher 单测 + Rust 侧真实 JVM e2e
  java-attach:
    name: Java Attach (agent tests + JVM e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: java-attach
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Maven Central 对 GH 共享出口 IP 限流（429 Too Many Requests，v0.0.61
      # CI 实测三连失败）——切阿里云镜像（public 聚合 central）
      - name: Configure Maven mirror (Central 429 rate limit)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <mirrors>
              <mirror>
                <id>aliyun</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven.aliyun.com/repository/public</url>
              </mirror>
            </mirrors>
          </settings>
          XML
      - name: Build attach jars + e2e demo target (plain-app classes8)
        run: |
          # Maven Central 偶发解析失败（v0.0.61 CI 实测：已存在的
          # maven-resources-plugin:3.4.0 报 Could not find artifact）——重试 3 次
          for i in 1 2 3; do
            if bash scripts/build_java_debug.sh; then break; fi
            if [ "$i" -lt 3 ]; then echo "构建失败，20s 后重试（第 $i 次）"; sleep 20; else exit 1; fi
          done
          mkdir -p java/examples/plain-app/build/classes8
          javac --release 8 -d java/examples/plain-app/build/classes8 $(find java/examples/plain-app/src -name '*.java')
      - name: Java agent/launcher unit tests
        run: mvn -q test -f java/miyo-java-agent/pom.xml && mvn -q test -f java/miyo-attach-launcher/pom.xml
      - name: Rust attach e2e (real JVM target)
        run: cargo test -p miyo-java-attach --test attach_e2e_test -- --include-ignored

  miyo-tauri:
    name: Check & Test (miyo-tauri 插件)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miyo-tauri
      - name: 规避 Azure Ubuntu 镜像不可达（CI 偶发 apt-get update 卡死）
        run: |
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
      - name: Install Linux dependencies (WebKit/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - name: Check
        working-directory: crates/miyo-tauri
        run: cargo check
      - name: Clippy（与主 workspace 同标准 -D warnings）
        working-directory: crates/miyo-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: crates/miyo-tauri
        run: cargo test
      # TS 绑定防漂移：导出 miyo-tauri view DTO 绑定（依赖 miyo-core/ts），与提交产物比对
      - name: Export TS bindings (miyo-tauri)
        working-directory: crates/miyo-tauri
        run: cargo test --features ts export_bindings
      - name: Check TS bindings drift (miyo-tauri)
        run: git diff --exit-code -- frontend/src/types/generated

  frontend:
    name: Build (Vue 前端 + Tauri 壳)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: 规避 Azure Ubuntu 镜像不可达（CI 偶发 apt-get update 卡死）
        run: |
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
      - name: Install Linux dependencies (WebKit/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - name: npm ci
        working-directory: frontend
        run: npm ci
      # tauri-build 在编译期校验 bundle.externalBin 文件存在，须先预置侧载二进制
      - name: Ensure miyo-mcp sidecar (bundle.externalBin)
        run: bash scripts/ensure-mcp-bin.sh
      # tauri-build 同样校验 bundle.resources：Java Debug attach jar 须先预置
      - name: Ensure Java Debug attach jars (bundle.resources)
        run: bash scripts/ensure-java-jars.sh
      # 复刻 tauri-cli 的版本一致性校验（npm 与 Rust 插件 major.minor 必须一致），
      # 否则 CI 的 cargo check 全绿、但 tauri build 打包时直接 exit 1（v0.0.32 踩过）。
      - name: Check Tauri npm/Rust 插件版本一致
        run: node scripts/check-tauri-plugin-versions.mjs
      # 插件签名工具自检：payload 规范 golden vector（与 Rust 测试同源互验，
      # 任一侧规范化漂移即红灯）+ Ed25519 roundtrip
      - name: Plugin signing tool selftest
        run: node scripts/sign_plugin.mjs selftest
      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint
      - name: Test (vitest)
        working-directory: frontend
        run: npm test
      # 类型检查独立门禁（build 已瘦身为纯 vite build，类型错误在这里拦截）
      - name: Typecheck (vue-tsc)
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend (vite)
        working-directory: frontend
        run: npm run build
      - name: Check Tauri shell
        working-directory: frontend/src-tauri
        run: cargo check
      - name: Check Tauri shell (release profile, 覆盖 tauri build 打包路径)
        working-directory: frontend/src-tauri
        run: cargo check --release
