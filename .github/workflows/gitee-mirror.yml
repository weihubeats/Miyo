name: Mirror to Gitee

# 把 main 与全部 tag 镜像到 Gitee（国内访问加速）。
# 前置：仓库 Secrets 配置 GITEE_TOKEN（Gitee 私人令牌，需 projects 写权限），
#       且 Gitee 上已手动创建同名仓库 weihubeats/Miyo。
# 首次同步建议本地执行一次全量：git push --mirror <gitee 地址>

on:
  push:
    branches: [main]
    tags: ['v*']
  # 手动重跑：mirror 因网络抖动失败时（GitHub runner 到 Gitee 偶发 SSL 超时），
  # 直接在 Actions 页一键重试，无需再靠空提交触发。
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 海外 runner 到 gitee.com 偶发 SSL 卡死（曾整段挂 5 分钟后 timeout）。
      # 用 http.lowSpeedLimit/Time 让它快速失败，配合下方重试而不是干等默认超时。
      - name: Configure git (mirror-friendly timeouts + retry)
        run: |
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30
          git config --global http.postBuffer 524288000
      # 推 HEAD:refs/heads/main 而不是分支名 main：actions/checkout 取指定 SHA
      # 后是 detached HEAD，本地不保证存在 refs/heads/main，`git push <url> main`
      # 会就地报 `src refspec main does not match any`，三次重试全在坏前置上跑、
      # 根本没发网络请求（2026-11 实测 7 次失败全因此）。
      # 注意必须写全 refs/heads/main 而不是简写 `HEAD:main`：目标侧不存在的
      # 分支名简写会让 git 拒绝（实测 "Did you mean 'HEAD:refs/heads/main'"）。
      # 推 tag 事件时 HEAD 指向 tag 的提交，仍然正确。
      - name: Push main to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # token 走环境变量注入的 askpass，不拼进 URL：避免明文写进
          # .git/config / reflog，也避免失败时被错误输出带进日志。
          export GIT_ASKPASS="$PWD/.git-askpass.sh"
          printf '#!/bin/sh\ncase "$1" in *sername*) echo oauth2 ;; *) echo "$GITEE_TOKEN" ;; esac\n' > "$GIT_ASKPASS"
          chmod +x "$GIT_ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          for i in 1 2 3; do
            echo "::group::push main (attempt $i)"
            if git push --force "https://gitee.com/weihubeats/Miyo.git" HEAD:refs/heads/main; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $i failed; retrying in 10s"
            sleep 10
          done
          echo "::error::push main failed after 3 attempts"
          exit 1
      # --tags 默认不带 --force：tag 被重打（发版流程常见）时永远被拒，
      # 而报错又和网络失败长得一样。显式加 --force 与 main 的镜像语义对齐。
      - name: Push tags to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          export GIT_ASKPASS="$PWD/.git-askpass.sh"
          printf '#!/bin/sh\ncase "$1" in *sername*) echo oauth2 ;; *) echo "$GITEE_TOKEN" ;; esac\n' > "$GIT_ASKPASS"
          chmod +x "$GIT_ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          for i in 1 2 3; do
            echo "::group::push tags (attempt $i)"
            if git push --force "https://gitee.com/weihubeats/Miyo.git" --tags; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $i failed; retrying in 10s"
            sleep 10
          done
          echo "::error::push tags failed after 3 attempts"
          exit 1