name: Mirror to Gitee

# 把 main 与全部 tag 镜像到 Gitee（国内访问加速）。
# 前置：仓库 Secrets 配置 GITEE_TOKEN（Gitee 私人令牌，需 projects 写权限），
#       且 Gitee 上已手动创建同名仓库 weihubeats/Miyo。
# 首次同步建议本地执行一次全量：git push --mirror <gitee 地址>

on:
  push:
    branches: [main]
    tags: ['v*']
  # 手动重跑：mirror 因网络抖动失败时（GitHub runner 到 Gitee 偶发 SSL 超时），
  # 直接在 Actions 页一键重试，无需再靠空提交触发。
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 海外 runner 到 gitee.com 偶发 SSL 卡死（曾整段挂 5 分钟后 timeout）。
      # 用 http.lowSpeedLimit/Time 让它快速失败，配合下方重试而不是干等默认超时。
      - name: Configure git (mirror-friendly timeouts + retry)
        run: |
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30
          git config --global http.postBuffer 524288000
      - name: Push main to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          for i in 1 2 3; do
            echo "::group::push main (attempt $i)"
            if git push --force "https://oauth2:${GITEE_TOKEN}@gitee.com/weihubeats/Miyo.git" main; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $i failed; retrying in 10s"
            sleep 10
          done
          echo "::error::push main failed after 3 attempts"
          exit 1
      - name: Push tags to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          for i in 1 2 3; do
            echo "::group::push tags (attempt $i)"
            if git push --force "https://oauth2:${GITEE_TOKEN}@gitee.com/weihubeats/Miyo.git" --tags; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $i failed; retrying in 10s"
            sleep 10
          done
          echo "::error::push tags failed after 3 attempts"
          exit 1